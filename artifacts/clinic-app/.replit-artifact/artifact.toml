kind = "mobile"
previewPath = "/"
title = "Clinic Reception App"
version = "1.0.0"
id = "artifacts/clinic-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24092

[services.development]
run = "pnpm --filter @workspace/clinic-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinic-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/clinic-app", "run", "serve" ]

[services.env]
PORT = "24092"
BASE_PATH = "/"
